{{- if and .Values.valkey.password (not .Values.valkey.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: valkey
  namespace: {{ include "valkey.namespace" . }}
  labels:
    {{- include "valkey.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.valkey.password | quote }}
{{- end }}
