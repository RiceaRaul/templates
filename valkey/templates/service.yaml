apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: {{ include "valkey.namespace" . }}
  labels:
    {{- include "valkey.labels" . | nindent 4 }}
spec:
  selector:
    app: valkey
  ports:
    - protocol: TCP
      port: {{ .Values.valkey.service.port }}
      targetPort: 6379
  type: ClusterIP
