{{- if .Values.openWebui.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: open-webui
  namespace: {{ include "ollama-stack.namespace" . }}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`{{ .Values.openWebui.ingress.host }}`)
      kind: Rule
      services:
        - name: open-webui
          port: {{ .Values.openWebui.service.port }}
{{- end }}
