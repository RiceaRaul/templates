apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: {{ include "ollama-stack.namespace" . }}
  labels:
    {{- include "ollama-stack.webui.labels" . | nindent 4 }}
spec:
  selector:
    app: open-webui
  ports:
    - protocol: TCP
      port: {{ .Values.openWebui.service.port }}
      targetPort: {{ .Values.openWebui.service.targetPort }}
  type: ClusterIP
