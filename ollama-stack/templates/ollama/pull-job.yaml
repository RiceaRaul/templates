apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-pull-{{ .Values.ollama.model | replace ":" "-" | replace "." "-" }}
  namespace: {{ include "ollama-stack.namespace" . }}
  annotations:
    # Re-rulează job-ul la upgrade dacă modelul se schimbă
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pull
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              echo "Pulling model: {{ .Values.ollama.model }}"
              curl -X POST http://ollama.{{ include "ollama-stack.namespace" . }}.svc.cluster.local:{{ .Values.ollama.service.port }}/api/pull \
                -H "Content-Type: application/json" \
                -d '{"name":"{{ .Values.ollama.model }}"}' \
                --max-time 3600 \
                --retry 5 \
                --retry-delay 10
