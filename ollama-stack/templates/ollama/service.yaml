apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: {{ include "ollama-stack.namespace" . }}
  labels:
    {{- include "ollama-stack.ollama.labels" . | nindent 4 }}
spec:
  selector:
    app: ollama
  ports:
    - protocol: TCP
      port: {{ .Values.ollama.service.port }}
      targetPort: {{ .Values.ollama.service.port }}
  type: ClusterIP
