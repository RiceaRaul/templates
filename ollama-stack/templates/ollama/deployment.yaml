apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: {{ include "ollama-stack.namespace" . }}
  labels:
    {{- include "ollama-stack.ollama.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        {{- include "ollama-stack.ollama.labels" . | nindent 8 }}
    spec:
      containers:
        - name: ollama
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.ollama.service.port }}
          env:
            - name: OLLAMA_HOST
              value: {{ .Values.ollama.env.host | quote }}
            - name: OLLAMA_KEEP_ALIVE
              value: {{ .Values.ollama.env.keepAlive | quote }}
            - name: OLLAMA_NUM_PARALLEL
              value: {{ .Values.ollama.env.numParallel | quote }}
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.ollama.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.ollama.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
