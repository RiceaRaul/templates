global:
  namespace: llm

openWebui:
  image:
    repository: ghcr.io/open-webui/open-webui
    tag: main
    pullPolicy: Always

  auth:
    enabled: true

  persistence:
    size: 2Gi
    storageClass: ""

  service:
    port: 80
    targetPort: 8080

  ingress:
    enabled: true
    host: "chat.inf.lan"
