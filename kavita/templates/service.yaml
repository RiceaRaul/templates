apiVersion: v1
kind: Service
metadata:
  name: kavita
  namespace: {{ include "kavita.namespace" . }}
  labels:
    {{- include "kavita.labels" . | nindent 4 }}
spec:
  selector:
    app: kavita
  ports:
    - protocol: TCP
      port: {{ .Values.kavita.service.port }}
      targetPort: {{ .Values.kavita.service.targetPort }}
  type: ClusterIP
