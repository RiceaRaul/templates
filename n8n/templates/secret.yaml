apiVersion: v1
kind: Secret
metadata:
  name: n8n
  namespace: {{ include "n8n.namespace" . }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.n8n.encryptionKey }}
  N8N_ENCRYPTION_KEY: {{ .Values.n8n.encryptionKey | quote }}
  {{- end }}
  {{- if and (not .Values.postgres.existingSecret) .Values.postgres.password }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  {{- end }}
  {{- if and .Values.redis.enabled (not .Values.redis.existingSecret) .Values.redis.password }}
  REDIS_PASSWORD: {{ .Values.redis.password | quote }}
  {{- end }}
