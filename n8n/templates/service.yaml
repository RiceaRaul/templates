apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: {{ include "n8n.namespace" . }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
spec:
  selector:
    app: n8n
  ports:
    - protocol: TCP
      port: {{ .Values.n8n.service.port }}
      targetPort: {{ .Values.n8n.service.targetPort }}
  type: ClusterIP
