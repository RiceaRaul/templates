{{- with .Values.portainer.adminPassword }}
{{- if and .password (not .existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: portainer-admin
  namespace: {{ include "portainer.namespace" $ }}
  labels:
    {{- include "portainer.labels" $ | nindent 4 }}
type: Opaque
stringData:
  password: {{ .password | quote }}
{{- end }}
{{- end }}
