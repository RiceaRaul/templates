apiVersion: v1
kind: Service
metadata:
  name: portainer
  namespace: {{ include "portainer.namespace" . }}
  labels:
    {{- include "portainer.labels" . | nindent 4 }}
spec:
  selector:
    app: portainer
  ports:
    - protocol: TCP
      port: {{ .Values.portainer.service.port }}
      targetPort: {{ .Values.portainer.service.targetPort }}
  type: ClusterIP
