{{- if .Values.portainer.clusterAdmin }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portainer
  namespace: {{ include "portainer.namespace" . }}
  labels:
    {{- include "portainer.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portainer
  labels:
    {{- include "portainer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: portainer
    namespace: {{ include "portainer.namespace" . }}
{{- end }}
