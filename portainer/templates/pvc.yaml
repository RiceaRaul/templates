apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portainer-data
  namespace: {{ include "portainer.namespace" . }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.portainer.persistence.size }}
  {{- if .Values.portainer.persistence.storageClass }}
  storageClassName: {{ .Values.portainer.persistence.storageClass }}
  {{- end }}
