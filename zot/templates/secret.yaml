{{- if and .Values.zot.auth.enabled (not .Values.zot.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: zot-htpasswd
  namespace: {{ include "zot.namespace" . }}
  labels:
    {{- include "zot.labels" . | nindent 4 }}
type: Opaque
stringData:
  htpasswd: |
    {{- .Values.zot.auth.htpasswd | trim | nindent 4 }}
{{- end }}
