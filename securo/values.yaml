# Default values for securo.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  # The public domain of the application (e.g., securo.local, app.securo.com)
  domain: "securo.inf.lan"
  # Set to true if the application is accessed over HTTPS (changes generated URLs)
  tls: false

  # For production, we recommend passing existingSecret instead of creating one via Helm values
  # existingSecret: "securo-secrets"

# If existingSecret is NOT set, this secret will be created with the values below
secret:
  # MUST change in production
  secretKey: "dev-secret-change-in-production"
  # External Postgres (postgresql.enabled is false). Set the real password here, or via
  # --set-string secret.databaseUrl=..., or keep it out of Git with global.existingSecret (key DATABASE_URL).
  # URL-encode special characters in the password.
  # The server MUST have the pgvector extension installed: migration 046 fails without it.
  # Run once on the database as superuser:  CREATE EXTENSION IF NOT EXISTS vector;
  databaseUrl: 'postgresql+asyncpg://securo:CHANGE_ME@postgres.db.svc.cluster.local:5432/securo'

  # Pluggy
  pluggyClientId: ""
  pluggyClientSecret: ""

  # Enable Banking
  enableBankingAppId: ""
  enableBankingPrivateKey: "" # Content of the PEM file

  # OIDC
  oidcClientId: ""
  oidcClientSecret: ""

  # OpenExchangeRates
  openexchangeratesAppId: ""

  # Agents (LLM)
  agentsMcpJwtSecret: "dev-mcp-secret-change-in-production"
  agentsOpenaiApiKey: ""
  agentsAnthropicApiKey: ""
  agentsOpenaiCompatApiKey: ""

# Non-sensitive configuration
config:
  debug: "false"
  # Set false only when oidc.enabled, oidc.clientId, and oidc.discoveryUrl are configured.
  localAuthEnabled: "true"
  # Leave empty to auto-compute from global.domain (e.g. http://securo.local/oauth/callback)
  pluggyOauthRedirectUri: ""
  enableBankingApiUrl: "https://api.enablebanking.com"
  # Leave empty to auto-compute from global.domain
  enableBankingOauthRedirectUri: ""
  simplefinEnabled: "false"
  simplefinApiUrl: "https://beta-bridge.simplefin.org"
  oidcEnabled: "false"
  oidcProviderName: "OIDC"
  oidcDiscoveryUrl: ""
  oidcRedirectUri: ""
  oidcScopes: "openid email profile"
  oidcAutoRegister: "true"
  # Link OIDC logins to existing accounts with the same email: disabled, verified_email, or email
  oidcExistingUserLinkMode: "disabled"
  oidcRequireVerifiedEmail: "true"
  oidcSyncRoles: "false"
  oidcRolesClaim: "groups"
  oidcAdminRoles: ""
  oidcWorkspaceRoleMap: ""
  fxSyncMode: "on_demand"
  tesouroDiretoEnabled: "true"

  # External Valkey (redis.enabled is false) — the shared instance from the ../valkey chart.
  # Valkey speaks the Redis protocol, so the URL scheme stays redis://.
  # With a password: redis://:<password>@valkey.cache.svc.cluster.local:6379/0
  redisUrl: 'redis://valkey.cache.svc.cluster.local:6379/0'
  celeryBrokerUrl: 'redis://valkey.cache.svc.cluster.local:6379/0'
  celeryResultBackend: 'redis://valkey.cache.svc.cluster.local:6379/0'

  storageLocalPath: "/app/data/attachments"
  agentsKnowledgeStoragePath: "/app/data/agent_knowledge"

  # Agents feature
  agentsEnabled: "false"
  agentsBuiltinMcpUrl: 'http://{{ include "securo.fullname" . }}-mcp-server:8765/mcp'
  agentsExternalMcpUrl: '{{ include "securo.frontendUrl" . }}/mcp'
  agentsExtraMcpServers: ""
  agentsMcpExternalTtlDays: "90"
  agentsDefaultProvider: "ollama"
  agentsDefaultModel: ""
  agentsOllamaBaseUrl: "http://ollama:11434"
  agentsOpenaiCompatBaseUrl: ""
  agentsEmbeddingProvider: "native"
  agentsEmbeddingModel: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"

# Backend configuration
backend:
  replicaCount: 1
  image:
    repository: registry.inf.lan/securo/securo-backend
    tag: 0.16.3-620150f
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Frontend configuration
frontend:
  backendUrl: ""
  replicaCount: 1
  image:
    repository: registry.inf.lan/securo/securo-frontend
    tag: 0.16.3-620150f
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Celery Worker configuration
celeryWorker:
  enabled: true
  replicaCount: 1
  image:
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Celery Beat configuration
celeryBeat:
  enabled: true
  image:
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Built-in MCP Server configuration
mcpServer:
  enabled: false
  replicaCount: 1
  image:
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8765
  resources:
    limits:
      cpu: 300m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

# Persistence for application data
# IMPORTANT: Since Backend, Celery Worker, and MCP Server all share the same attachment files,
# they mount these PVCs concurrently. If your pods are scheduled across multiple nodes,
# you MUST use a StorageClass that supports `ReadWriteMany` (RWX) access mode (e.g., NFS, CephFS).
# `ReadWriteOnce` will only work if you restrict all pods to a single node.
persistence:
  attachments:
    enabled: true
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  # Both agent volumes are created only when config.agentsEnabled is true,
  # so leaving these on costs a workspace that never enabled agents nothing,
  # and a workspace that did keeps the volume it already has across upgrades.
  agentKnowledge:
    enabled: true
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  agentEmbeddingModels:
    enabled: true
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce

# Standard Kubernetes Ingress
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  tls: []
  #  - secretName: securo-tls
  #    hosts:
  #      - securo.local

# Traefik IngressRoute: /api -> backend, /mcp -> mcp-server (when enabled), / -> frontend.
# Primary host is global.domain; extraHosts get the same routes.
ingressRoute:
  enabled: true
  entryPoints:
    - web
  extraHosts: []
    # - "securo.ricearaul.com"
  # Optional Traefik TLS (also set global.tls: true so generated URLs use https)
  tls:
    enabled: false
    certResolver: ""
    secretName: ""

httpRoute:
  enabled: false
  parentRefs: []
  # - name: external-gateway
  #   namespace: gateway-system
  # Path matches will route /api to backend and / to frontend.

# Bundled PostgreSQL StatefulSet. Disabled: using an external database (see secret.databaseUrl).
postgresql:
  enabled: false
  image:
    repository: docker.io/pgvector/pgvector
    tag: pg16
    pullPolicy: IfNotPresent
  resources: {}

# Bundled Redis StatefulSet. Disabled: using external Valkey (see config.redisUrl).
redis:
  enabled: false
  image:
    repository: docker.io/library/redis
    tag: 8-alpine
    pullPolicy: IfNotPresent
  resources: {}

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
