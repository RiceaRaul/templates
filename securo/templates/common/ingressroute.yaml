{{- if .Values.ingressRoute.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "securo.fullname" . }}
  labels:
    {{- include "securo.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- range .Values.ingressRoute.entryPoints }}
    - {{ . }}
    {{- end }}
  routes:
    # IMPORTANT: specific paths FIRST
    - match: ({{ include "securo.hostMatch" . }}) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: {{ include "securo.fullname" . }}-backend
          port: {{ .Values.backend.service.port }}
    {{- if .Values.mcpServer.enabled }}
    - match: ({{ include "securo.hostMatch" . }}) && PathPrefix(`/mcp`)
      kind: Rule
      services:
        - name: {{ include "securo.fullname" . }}-mcp-server
          port: {{ .Values.mcpServer.service.port }}
    {{- end }}
    # LAST: catch all
    - match: ({{ include "securo.hostMatch" . }}) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: {{ include "securo.fullname" . }}-frontend
          port: {{ .Values.frontend.service.port }}
  {{- if .Values.ingressRoute.tls.enabled }}
  tls:
    {{- if .Values.ingressRoute.tls.secretName }}
    secretName: {{ .Values.ingressRoute.tls.secretName }}
    {{- end }}
    {{- if .Values.ingressRoute.tls.certResolver }}
    certResolver: {{ .Values.ingressRoute.tls.certResolver }}
    {{- end }}
  {{- end }}
{{- end }}
